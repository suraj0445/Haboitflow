
<!DOCTYPE html>
<html>
<head>
    <title>HabitFlow Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h2>✓ HabitFlow</h2>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="habits.html">My Habits</a>
        <a href="progress.html">Progress</a>
        <button id="logoutBtn">Logout</button>
    </nav>
</header>

<div class="container">
    <h1>My Dashboard</h1>
    <p>Welcome to your daily habit tracker!</p>

    <div class="stats">
        <div class="card">
            <h3>Total Habits</h3>
            <h1 id="totalHabits">0</h1>
        </div>

        <div class="card">
            <h3>Completed Today</h3>
            <h1 id="completedToday">0</h1>
        </div>

        <div class="card">
            <h3>Best Streak</h3>
            <h1 id="bestStreak">0 days</h1>
        </div>
    </div>

    <h2>Today's Habits</h2>
    <div id="todayList"></div>

    <a class="btn" href="habits.html">+ Add New Habit</a>
</div>

<script src="js/app.js"></script>
</body>
</html>
